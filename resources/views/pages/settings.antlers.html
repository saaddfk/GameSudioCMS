---
title: Settings
layout: layouts/main
---
<h1 class="text-3xl font-bold mb-6">Application Settings</h1>

<form id="settings-form" class="bg-white dark:bg-gray-800 shadow-md rounded px-8 pt-6 pb-8 mb-4">
    {{ csrf_field }}
    <div class="mb-4">
        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="extraction-interval">
            Default Extraction Interval (seconds):
        </label>
        <input id="extraction-interval" name="extraction_interval" type="number" step="0.1" min="0.1" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-300 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-700 dark:border-gray-600 sm:w-1/3">
    </div>

    <div class="mb-4">
        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="confidence-threshold">
            Object Detection Confidence Threshold (0.0 - 1.0):
        </label>
        <input id="confidence-threshold" name="confidence_threshold" type="number" step="0.05" min="0" max="1" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-300 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-700 dark:border-gray-600 sm:w-1/3">
    </div>

    <div class="mb-4">
        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="clip-padding-before">
            Clip Padding Before Event (seconds):
        </label>
        <input id="clip-padding-before" name="clip_padding_before" type="number" step="0.1" min="0" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-300 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-700 dark:border-gray-600 sm:w-1/3">
    </div>

    <div class="mb-6">
        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="clip-padding-after">
            Clip Padding After Event (seconds):
        </label>
        <input id="clip-padding-after" name="clip_padding_after" type="number" step="0.1" min="0" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-300 leading-tight focus:outline-none focus:shadow-outline dark:bg-gray-700 dark:border-gray-600 sm:w-1/3">
    </div>

    <div class="flex items-center justify-between">
        <button type="submit" id="save-settings-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Save Settings
        </button>
    </div>
    <div id="settings-status" class="mt-4 text-sm"></div>
</form>
