<!doctype html>
<html lang="{{ site:short_locale ?? 'en' }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title ?? site:name }} - Minecraft Montage Helper</title>
    {{ vite src="resources/js/site.js|resources/css/site.css" }}
    <script>
        // Pass CSRF token to JavaScript
        window.csrf_token = '{{ csrf_token }}';
        // Pass base URL for AJAX requests if needed
        window.base_url = '{{ site:url }}';
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans">
    <nav class="bg-gray-800 dark:bg-gray-700 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{{ site:url }}/" class="text-lg font-semibold">{{ site:name }} - Montage Helper</a>
            <div>
                <a href="{{ relate:url to='upload_video' }}" class="px-3 py-2 rounded hover:bg-gray-700 dark:hover:bg-gray-600">Upload Video</a>
                <a href="{{ relate:url to='workspace' }}" class="px-3 py-2 rounded hover:bg-gray-700 dark:hover:bg-gray-600">Workspace</a>
                <a href="{{ relate:url to='settings' }}" class="px-3 py-2 rounded hover:bg-gray-700 dark:hover:bg-gray-600">Settings</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div id="app" class="mt-6">
            {{ template_content }}
        </div>
    </main>

    <footer class="bg-gray-200 dark:bg-gray-800 text-center p-4 mt-8">
        <p>&copy; {{ now format="Y" }} Minecraft Montage Helper. Powered by Statamic.</p>
    </footer>
</body>
</html>
